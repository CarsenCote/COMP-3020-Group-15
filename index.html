<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./stylesheets/styles.css">
    <!--Library imports-->
    <script src="./libraries/jquery-3.7.1.min.js"></script>

    <!--Script imports-->
    <script src="./src/members-data.js"></script>
    <script src="./src/posts-data.js"></script>
    <script src="./src/categories-data.js"></script>

<body>
    <div class="nav-bar">
        <div class="nav-button" id="back-button">
            <img class="nav-button-img" src="./public/star.png" draggable="false">

        </div>
        <div class="nav-button" id="home-button">

<!--Sign In/Sign Up Screen Template-->
<script id="signin-template" type="text/template">
    <link rel="stylesheet" href = "./stylesheets/signin.css">
    <div class="signin-container">
        <p class="signin-title">Universe of Manitoba</p>
        <form class="signin-form" id="signin-form">
            <div class="name-container">
                <div class="fname-container">
                    <input type="text" id="fname" name="fname" required>
                    <label for="fname" class="label">First Name</label>
                </div>
                <div class="lname-container">
                    <input type="text" id="lname" name="lname" required>
                    <label for="lname" class="label">Last Name</label>
                </div>
            </div>
            <div class="email-container">
                <input type="text" id="email" name="email" required>
                <label for="email" class="label">School E-Mail</label>
            </div>
            <button type="submit" class="signin-button">
                Sign in
            </button>
        </form>
    </div>
</script>

<!--Blackhole Screen Template-->
<script id="blackhole-template" type="text/template">
    <link rel="stylesheet" href = "./stylesheets/blackhole.css">
    <div class="blackhole-container">
        <img class="blackhole" src="./public/blackhole.png"/>
        <p class="blackhole-title">Explore</p>
    </div>
</script>

<!--Categories Screen Template-->
<script id="categories-template" type="text/template">
    <link rel="stylesheet" href="./stylesheets/categories.css">
    <div class="categories-page-container">
        <p class="categories-title">Please choose a category to browse . . .</p>
        <div id="categories-container">
        </div>
    </div>
</script>

<!--Category Template-->
<script id="category-template" type="text/template">
    <div class="category-galaxy">
        <div class="category">
            <p class="category-name"></p>
            <p class="category-description"></p>
            <img class="category-img" draggable="false">
        </div>
        <img class="category-galaxy-img" src="./public/galaxy.png">
    </div>
    
</script>

<!--Clubs Select Screen Template-->
<script id="club-select-template" type="text/template">
    <link rel="stylesheet" href="./stylesheets/clubs.css">
    <div class="clubs-select-container">
        <p class="clubs-title">Select a club to learn more</p>
        <div class="clubs-wheel" id="clubs-container">
            <!--Clubs will be dynamically added here as orbiting circles-->
        </div>
    </div>
</script>

<!--Club Select - Club Template-->
<script id="club-bubble-template" type="text/template">
    <div class="club">
        <p class="club-name"></p>
        <p class="club-description"></p>
    </div>
</script>

<!--Clubs Page Screen Template-->
<script id="club-page-template" type="text/template">
    <link rel="stylesheet" href="./stylesheets/clubspage.css">
    <div id="club-page-container">

        <header class="club-header">
            <h1 class="club-name"></h1>
            <button id="join-leave-btn">Join</button>
        </header>

        <div class="club-layout">

            <div class="posts-container" id="posts">

                <div class="posts-header">
                    <h2 class="posts-header-title">Posts</h2>
                    <p class="posts-header-description">Recent news, updates, and discussions go here.</p>
                </div>

                <div class="post-element-container">

                </div>

            </div>

            <div class="about-us-container" id="about">

                <div class="about-us-header">
                    <h2 class="about-us-header-title">About Us</h2>
                    <p class="about-us-header-description"></p>
                </div>

                <header class="members-header">
                        <h2 class="members-header-title">Members</h2>
                        <button id="members-button">Collapse</button>
                </header>
                
                <div class="members-container">
                </div>
            </div>

            <div class="events-container" id="events">

                <div class="events-header">
                    <h2 class="events-header-title">Events</h2>
                    <p class="events-header-description">Check out our upcoming events and activities.</p>
                </div>

                <div class="event-element-container">
                </div>
                
            </div>
        </div>
    </div>
</script>

<!--Post Template-->
<script id="post-template" type="text/template">

    <div class="post-container">

        <header class="post-header">
            <h1 class="post-title"></h1>
            <h2 class="post-date"></h2>
        </header>

        <p class="post-content"></p>
    </div>

</script>

<!--Event Template-->
<script id="event-template" type="text/template">

    <div class="event-container">

        <header class="event-header">
            <h1 class="event-title"></h1>
            <h3 class="event-date"></h3>
        </header>

        <div class="event-content">
            <h3 class="event-time"></h3>
            <button class="add-remove-event-button">Add</button>
        </div>
    </div>

</script>

<!--Member Template-->
<script id="member-template" type="text/template">

    <div class="member-container">
        <h2 class="member-name"></h2>
        <img class="member-img", src="./public/crown.png"/>
    </div>
    
</script>

            <!--add log out button here-->
        </div>

        <div class="user-calendar-container">  
            <p class="calendar-title">Calendar</p>
        </div>

        <div class="user-feed-container"> 
            <p class="user-feed">New Posts</p>
        </div>

    </div>
</script>

<!--User's Joined Club Template-->
<script id="joined-club-template" type="text/template">
    <div class="joined-club">
        <p class="club-name"></p>
    </div>
</script>
