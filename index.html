<!--Back Button Template-->


<!--Sign In/Sign Up Screen Template-->
<script id="signin-template" type="text/template">
    <link rel="stylesheet" href = "./stylesheets/signin.css">
    <div class="signin-container">
        <p class="signin-title">Universe of Manitoba</p>
        <form class="signin-form" id="signin-form">
            <div class="name-container">
                <div class="fname-container">
                    <input type="text" id="fname" name="fname" required>
                    <label for="fname" class="label">First Name</label>
                </div>
                <div class="lname-container">
                    <input type="text" id="lname" name="lname" required>
                    <label for="lname" class="label">Last Name</label>
                </div>
            </div>
            <div class="email-container">
                <input type="text" id="email" name="email" required>
                <label for="email" class="label">School E-Mail</label>
            </div>
            <button type="submit" class="signin-button">
                Sign in
            </button>
        </form>
    </div>
</script>

<!--Clubs Page Screen Template-->
<script id="clubspage-template" type="text/template">
    <link rel="stylesheet" href="./stylesheets/clubspage.css">
    
    <div class="club">
        <p class="club-title"></p>
        <p class="club-description"></p>
    </div>

  <header class="club-header">
    <h1 class="club-name"></h1>
    <button class="join-btn">Join</button>
  </header>

  <main class="club-layout">
    <div class="posts-container" id="posts">
      <h2>Posts</h2>
      <p>Recent news, updates, and discussions go here.</p>
    </div>

    <div class="aboutus-container" id="about">
      <h2>About Us</h2>
      <p>Learn more about who we are and what we do.</p>
    </div>

    <div class="events-container" id="events">
      <h2>Events</h2>
      <p>Check out our upcoming events and activities.</p>
    </div>
  </main>

</script>
